<p>הציונים של כל מקצוע</p>
<ul>
    @for(item of marks; track item.subject){
    <li>
        {{item.subject}}: {{item.mark}} <br>
        @if (item.mark >= 60)
        {
            <span class="passed" > עבר</span>
        }@else{
            <span class="failed" [ngStyle]="{color: 'red', 'font-weight': 'bold'}"h> לא עבר</span>
        }
    </li>
}@empty{
    <li>אין נתונים להצגה</li>
}
</ul>
<p>ממוצע הציונים: <br>
{{averageMark}}
</p>
