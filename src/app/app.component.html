<main class="main">
  <div class="content">
    <section class="login-panel" aria-labelledby="page-title">
      <h1 id="page-title">{{ title }}</h1>
      <label for="tz">תעודת זהות:</label>
      <input id="tz" type="text" placeholder="הכנס תעודת זהות:" />

      <div class="terms-row">
        <input
          id="terms"
          type="checkbox"
          (change)="acceptedTerms = $any($event.target).checked"
        />
        <label for="terms">האם קראת את התקנון?</label>
      </div>

      <button type="button" [disabled]="!acceptedTerms">התחברות</button>
    </section>
    <app-marks-of-students></app-marks-of-students>
  </div>
</main>
<router-outlet />
